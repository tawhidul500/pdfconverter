name: novapdf-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novapdf
      POSTGRES_USER: novapdf
      POSTGRES_PASSWORD: novapdf
    ports:
      - "5432:5432"
    volumes:
      - novapdf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapdf -d novapdf"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - novapdf-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: novapdf
      MINIO_ROOT_PASSWORD: novapdf-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - novapdf-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 novapdf novapdf-local-secret &&
      mc mb --ignore-existing local/novapdf-private &&
      mc anonymous set none local/novapdf-private &&
      exit 0;"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  pdf-converter:
    build:
      context: ./conversion-service
    environment:
      NOVAPDF_WEB_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://172.24.48.1:3000,http://172.21.32.1:3000
      NOVAPDF_WEB_ORIGIN_REGEX: ^https?://(localhost|127\.0\.0\.1|172\.24\.48\.1|172\.21\.32\.1)(:\d+)?$
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    profiles: ["application"]
    build:
      context: ./backend
    command: ["node", "dist/main.js"]
    environment: &backend-environment
      NODE_ENV: development
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      SIGNER_PUBLIC_URL: http://localhost:4000/api/v1/signer
      DATABASE_URL: postgresql://novapdf:novapdf@postgres:5432/novapdf
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_COOKIE_NAME: novapdf_session
      SESSION_TTL_HOURS: 168
      COOKIE_SECURE: "false"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: novapdf-private
      OBJECT_STORAGE_ACCESS_KEY: novapdf
      OBJECT_STORAGE_SECRET_KEY: novapdf-local-secret
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_DOWNLOAD_TTL_SECONDS: 900
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      EMAIL_FROM: NovaPDF <signatures@novapdf.local>
      EMAIL_WEBHOOK_SECRET: local-development-webhook-secret-change-me
      SIGNER_TOKEN_TTL_HOURS: 168
      MAX_PDF_BYTES: 52428800
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  worker:
    profiles: ["application"]
    build:
      context: ./backend
    command: ["node", "dist/worker.js"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

volumes:
  novapdf-postgres:
  novapdf-redis:
  novapdf-minio:
